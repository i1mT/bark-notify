name: BarkDesk
options:
  bundleIdPrefix: app.barkdesk
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/CSQLite"
    OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/Sources/CSQLite/module.modulemap"

targets:
  BarkCore:
    type: framework
    platform: macOS
    sources:
      - path: ../Sources/BarkCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.barkdesk.core
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
    dependencies:
      - sdk: libsqlite3.tbd

  NotifySupport:
    type: framework
    platform: macOS
    sources:
      - path: ../Sources/NotifySupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.barkdesk.notify-support
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
    dependencies:
      - target: BarkCore

  notify:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/NotifyCLI
    settings:
      base:
        PRODUCT_NAME: notify
    dependencies:
      - target: NotifySupport

  BarkDesk:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/BarkDesk
    resources:
      - path: ../Assets/BarkDeskIcon.png
    info:
      path: BarkDesk-Info.plist
      properties:
        CFBundleDisplayName: BarkDesk
        CFBundleName: BarkDesk
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.barkdesk.macos
        PRODUCT_NAME: BarkDesk
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Xcode/BarkDesk-Info.plist
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - target: BarkCore
      - target: notify

  BarkCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Tests/BarkCoreTests
    dependencies:
      - target: BarkCore

  BarkDeskTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../Tests/BarkDeskTests
    dependencies:
      - target: BarkDesk

  BarkDeskUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../Tests/BarkDeskUITests
    dependencies:
      - target: BarkDesk

schemes:
  BarkDesk:
    build:
      targets:
        BarkDesk: all
        notify: all
        BarkCoreTests: [test]
        BarkDeskTests: [test]
        BarkDeskUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BarkCoreTests
        - BarkDeskTests
        - BarkDeskUITests
    archive:
      config: Release

  notify:
    build:
      targets:
        notify: all
    run:
      config: Debug
